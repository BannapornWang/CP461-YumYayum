name: A2_sinc_disabled
model_type: RealESRNetModel
scale: 4
num_gpu: auto
manual_seed: 461
gt_usm: true
resize_prob:
- 0.2
- 0.7
- 0.1
resize_range:
- 0.15
- 1.5
gaussian_noise_prob: 0.5
noise_range:
- 1
- 30
poisson_scale_range:
- 0.05
- 3
gray_noise_prob: 0.4
jpeg_range:
- 30
- 95
second_blur_prob: 0.8
resize_prob2:
- 0.3
- 0.4
- 0.3
resize_range2:
- 0.3
- 1.2
gaussian_noise_prob2: 0.5
noise_range2:
- 1
- 25
poisson_scale_range2:
- 0.05
- 2.5
gray_noise_prob2: 0.4
jpeg_range2:
- 30
- 95
gt_size: 192
queue_size: 180
datasets:
  train:
    name: DF2K+OST (CP461 team prepared)
    type: RealESRGANDataset
    dataroot_gt: datasets/DF2K_sub
    meta_info: datasets/meta_info_train.txt
    io_backend:
      type: disk
    blur_kernel_size: 21
    kernel_list:
    - iso
    - aniso
    - generalized_iso
    - generalized_aniso
    - plateau_iso
    - plateau_aniso
    kernel_prob:
    - 0.45
    - 0.25
    - 0.12
    - 0.03
    - 0.12
    - 0.03
    sinc_prob: 0.0
    blur_sigma:
    - 0.2
    - 3
    betag_range:
    - 0.5
    - 4
    betap_range:
    - 1
    - 2
    blur_kernel_size2: 21
    kernel_list2:
    - iso
    - aniso
    - generalized_iso
    - generalized_aniso
    - plateau_iso
    - plateau_aniso
    kernel_prob2:
    - 0.45
    - 0.25
    - 0.12
    - 0.03
    - 0.12
    - 0.03
    sinc_prob2: 0.0
    blur_sigma2:
    - 0.2
    - 1.5
    betag_range2:
    - 0.5
    - 4
    betap_range2:
    - 1
    - 2
    final_sinc_prob: 0.0
    gt_size: 192
    use_hflip: true
    use_rot: false
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: null
network_g:
  type: RRDBNet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 23
  num_grow_ch: 32
path:
  pretrain_network_g: null
  param_key_g: params_ema
  strict_load_g: true
  resume_state: null
  experiments_root: experiments
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 0.0002
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: MultiStepLR
    milestones:
    - 1000000
    gamma: 0.5
  total_iter: 45000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
val:
  val_freq: 5000.0
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
logger:
  print_freq: 100
  save_checkpoint_freq: 1000
  use_tb_logger: true
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: gloo
  port: 29500

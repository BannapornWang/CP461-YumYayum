# Custom Real-ESRNet x4 Training Configuration
# Adapted for RTX 3060 12GB + prepared datasets
# Original source: options/train_realesrnet_x4plus.yml

# general settings
name: train_RealESRNetx4_CP461_team_5h
model_type: RealESRNetModel
scale: 4
num_gpu: auto  # auto: infer from visible GPUs
manual_seed: 0

# options for synthesizing training data in RealESRNetModel
gt_usm: True  # Unsharp mask the ground truth

# first degradation process
resize_prob: [0.2, 0.7, 0.1]  # up, down, keep
resize_range: [0.15, 1.5]
gaussian_noise_prob: 0.5
noise_range: [1, 30]
poisson_scale_range: [0.05, 3]
gray_noise_prob: 0.4
jpeg_range: [30, 95]

# second degradation process
second_blur_prob: 0.8
resize_prob2: [0.3, 0.4, 0.3]  # up, down, keep
resize_range2: [0.3, 1.2]
gaussian_noise_prob2: 0.5
noise_range2: [1, 25]
poisson_scale_range2: [0.05, 2.5]
gray_noise_prob2: 0.4
jpeg_range2: [30, 95]

# ADJUSTED FOR RTX 3060 12GB:
# - patch size reduced from 256 to 192 (saves ~25% memory)
# - batch size reduced from 12 to 4 (saves ~67% memory, fits in 12GB VRAM)
# - number of workers reduced from 5 to 4 for Windows stability
gt_size: 192
queue_size: 180

# dataset and data loader settings
datasets:
  train:
    name: DF2K+OST (CP461 team prepared)
    type: RealESRGANDataset
    dataroot_gt: datasets/DF2K_sub  # Path to cropped subimages
    meta_info: datasets/meta_info_train.txt  # prepared subimage index
    io_backend:
      type: disk

    # degradation kernel settings
    blur_kernel_size: 21
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob: 0.1
    blur_sigma: [0.2, 3]
    betag_range: [0.5, 4]
    betap_range: [1, 2]

    # second degradation kernel settings
    blur_kernel_size2: 21
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob2: 0.1
    blur_sigma2: [0.2, 1.5]
    betag_range2: [0.5, 4]
    betap_range2: [1, 2]

    final_sinc_prob: 0.8

    # ADJUSTED FOR RTX 3060: patch size 192x192 instead of 256x256
    gt_size: 192
    use_hflip: True
    use_rot: False

    # data loader settings
    use_shuffle: true
    num_worker_per_gpu: 0  # reduced to 0 for Windows stability
    batch_size_per_gpu: 0  # reduced to fit RTX 3060 12GB
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # Paired validation is disabled because no low-resolution validation images are available.

# network architecture
network_g:
  type: RRDBNet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64  # Feature channels
  num_block: 23  # Residual blocks
  num_grow_ch: 32  # Growing channels in RRDB blocks

# model path settings
path:
  # No pretrained model - train from scratch with synthesized degradation
  pretrain_network_g: ~  # or path to pretrained weights if resuming
  param_key_g: params_ema
  strict_load_g: true
  resume_state: experiments/train_RealESRNetx4_CP461_team_5h/training_states/52000.state  # Set to checkpoint path to resume training
  experiments_root: experiments  # Directory for saving checkpoints/logs

# training settings
train:
  ema_decay: 0.999  # Exponential moving average for weights
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [1000000]  # Reduce LR at 1M iterations
    gamma: 0.5  # Multiply LR by 0.5

  total_iter: 100000  # ~5 hours based on measured RTX 3060 throughput
  warmup_iter: -1  # No warmup

  # loss function settings
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3  # Validate every 5,000 iterations
  save_img: False  # Don't save validation images (saves disk space)

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    # Uncomment for SSIM metric
    # ssim:
    #   type: calculate_ssim
    #   crop_border: 4
    #   test_y_channel: false

# logging settings
logger:
  print_freq: 100  # Print loss every 100 iterations
  save_checkpoint_freq: !!float 1e4  # Save checkpoint every 10,000 iterations
  use_tb_logger: true  # Enable TensorBoard logging
  wandb:  # Weights & Biases logging (optional)
    project: ~  # Set to project name to enable wandb
    resume_id: ~

# distributed training settings
dist_params:
  backend: nccl  # NCCL backend for multi-GPU
  port: 29500

# --- GPU Memory Estimation ---
# RTX 3060 12GB VRAM usage estimate (mixed precision not enabled):
#   - Batch size 1, patch 256x256, fp32: ~8.5 GB
#   - Batch size 1, patch 192x192, fp32: ~4.8 GB
#   - Batch size 4, patch 192x192, fp32: ~10-11 GB (ADJUSTED TARGET)
#   - Batch size 4, patch 192x192, fp16: ~5-6 GB (with mixed precision)
#
# Current config uses batch=4, patch=192 which fits RTX 3060 with ~1-2 GB headroom
#
# To fit larger batch or patch size:
#   1. Enable mixed precision (fp16) in basicsr
#   2. Reduce batch_size_per_gpu further
#   3. Reduce gt_size (patch size)
#   4. Reduce num_worker_per_gpu
#
# To use larger batch/patch for better convergence:
#   1. Use A100/RTX 4090 (24GB+)
#   2. Adjust batch=6-8, patch=256
